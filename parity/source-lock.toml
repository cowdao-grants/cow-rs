# Upstream source pins for cow-rs conformance.
#
# Each entry below names a repository whose source we treat as the
# authority for some piece of cow-rs behaviour: EIP-712 hashing, order
# UID packing, app-data canonicalisation, fee composition, settlement
# domain separators. Conformance vectors elsewhere in the repo reference
# these shas; CI cross-checks that every reference in `recon/` and
# `crates/cowprotocol/src/**/*.rs` is one of the shas listed here, so a
# silent upstream drift can never go unnoticed.
#
# Bumping a pin is a deliberate act:
#   1. Update the `sha` field below.
#   2. Re-derive every vector that references it (re-fetch with
#      `tools/vector-gen` or by hand) and update the test data.
#   3. Run `just test` and ensure the vector round-trips byte-for-byte.
#   4. Mention the bump in the PR description so reviewers can audit
#      what behaviour shifted.
#
# This file is the cow-rs analogue of the `parity/source-lock.yaml`
# concept in PR #3 ("ferrous foundation"). We adopted the shape but
# anchored it to the recon work in `recon/cross-sdk-vectors/`.

version = 1

[[source]]
name = "cow-sdk-ts"
repo = "cowprotocol/cow-sdk"
url = "https://github.com/cowprotocol/cow-sdk"
sha = "00c3dbd41c086ff9a51d5e5a30648615d4c66d0d"
why = "TypeScript SDK — canonical user-facing surface (quote, sign, submit, app-data, EIP-712)."
producers = [
    "packages/order-book/src/quoteAmountsAndCosts/getQuoteAmountsAndCosts.ts",
    "packages/order-book/src/quoteAmountsAndCosts/getProtocolFeeAmount.ts",
    "packages/order-book/src/quoteAmountsAndCosts/getQuoteAmountsAfterPartnerFee.ts",
    "packages/order-book/src/quoteAmountsAndCosts/getQuoteAmountsAfterSlippage.ts",
    "packages/order-signing/src/utils/typedData.ts",
    "packages/trading/src/postCoWProtocolTrade.ts",
    "packages/trading/src/postCoWProtocolTrade.test.ts",
]

